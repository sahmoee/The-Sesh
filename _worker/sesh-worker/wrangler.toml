name = "sesh-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ---------------------------------------------------------------------------
# Durable Objects (#C3, #C4): SocialDO serializes all social-graph writes and
# pushes realtime change events over WebSockets; RoomDO holds each chat room's
# messages one-record-per-message and streams new messages live.
# ---------------------------------------------------------------------------
[durable_objects]
bindings = [
  { name = "SOCIAL", class_name = "SocialDO" },
  { name = "ROOMS",  class_name = "RoomDO" },
  { name = "LOUNGE", class_name = "LoungeDO" },
]

[[migrations]]
tag = "v1-durable-objects"
new_sqlite_classes = ["SocialDO", "RoomDO"]

# The Lounge's public feed (SESH-RL-001-R2).
[[migrations]]
tag = "v2-lounge"
new_sqlite_classes = ["LoungeDO"]

# KV is retained for Spotify refresh tokens (single-key records; no concurrent
# write hazard) and for reading legacy data during migration.
[[kv_namespaces]]
binding = "SESH"
id = "2354f50ae4ff44f49b767f4dca8d82f3"

# Secrets (set with `wrangler secret put <NAME>`):
#   SESSION_SECRET          long random string; signs session tokens (#C1)
#   APNS_KEY_ID             10-char Key ID of the APNs .p8
#   APNS_TEAM_ID            10-char Apple Team ID
#   APNS_KEY_P8             full contents of the .p8 file
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   ADMIN_KEY               guards /api/admin/export
#   DC_KEY_ID / DC_TEAM_ID / DC_KEY_P8   DeviceCheck key (#C2; falls back to
#                           the APNs key if it has the capability)
[vars]
APNS_BUNDLE_ID = "com.sowens.The-SESH-"
# Audience check for Sign in with Apple identity tokens (#C1).
APPLE_BUNDLE_ID = "com.sowens.The-SESH-"
# Set to "1" only for a dev worker paired with Xcode debug builds.
# APNS_USE_SANDBOX = "1"
# DeviceCheck enforcement (#C2): validate-and-log first, then set to "1" to
# reject auth exchanges without a valid Apple device token. Keep OFF for dev
# workers - the Simulator cannot generate DeviceCheck tokens.
# DEVICECHECK_REQUIRED = "1"
# DEVICECHECK_USE_SANDBOX = "1"

# ---------------------------------------------------------------------------
# (#C10) Environments. Deploy with `wrangler deploy --env dev` (or staging).
# Each env is a separate Worker + separate Durable Objects, so test data never
# touches production. Secrets are per-env: `wrangler secret put NAME --env dev`.
# Point a Debug build at it via the "sesh.dev.workerURL" UserDefaults override.
# ---------------------------------------------------------------------------
[env.dev]
name = "sesh-worker-dev"
vars = { APNS_BUNDLE_ID = "com.sowens.The-SESH-", APPLE_BUNDLE_ID = "com.sowens.The-SESH-", APNS_USE_SANDBOX = "1" }
durable_objects.bindings = [
  { name = "SOCIAL", class_name = "SocialDO" },
  { name = "ROOMS",  class_name = "RoomDO" },
  { name = "LOUNGE", class_name = "LoungeDO" },
]
[[env.dev.migrations]]
tag = "v1-durable-objects"
new_sqlite_classes = ["SocialDO", "RoomDO"]

[[env.dev.migrations]]
tag = "v2-lounge"
new_sqlite_classes = ["LoungeDO"]

[env.staging]
name = "sesh-worker-staging"
vars = { APNS_BUNDLE_ID = "com.sowens.The-SESH-", APPLE_BUNDLE_ID = "com.sowens.The-SESH-", APNS_USE_SANDBOX = "1" }
durable_objects.bindings = [
  { name = "SOCIAL", class_name = "SocialDO" },
  { name = "ROOMS",  class_name = "RoomDO" },
  { name = "LOUNGE", class_name = "LoungeDO" },
]
[[env.staging.migrations]]
tag = "v1-durable-objects"
new_sqlite_classes = ["SocialDO", "RoomDO"]

[[env.staging.migrations]]
tag = "v2-lounge"
new_sqlite_classes = ["LoungeDO"]
