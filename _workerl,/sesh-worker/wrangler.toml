name = "sesh-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"

# KV namespace backing presence, cyphers, live, chat, and the feed.
# Create it once with:
#   wrangler kv:namespace create SESH
# then paste the returned id below.
[[kv_namespaces]]
binding = "SESH"
id = "2354f50ae4ff44f49b767f4dca8d82f3"

# Push (APNs). Non-secret var here; the .p8/Key ID/Team ID are secrets set via
# `wrangler secret put APNS_KEY_P8 / APNS_KEY_ID / APNS_TEAM_ID`.
[vars]
APNS_BUNDLE_ID = "com.sowens.The-SESH-"
